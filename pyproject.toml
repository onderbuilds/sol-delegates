[project]
name = "sol-delegates"
version = "0.1.0"
description = "Find SPL token approvals (delegates) sitting on your Solana wallet"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

[project.scripts]
sol-delegates = "soldelegates.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["soldelegates"]
